.text-\[\#ffb700\] {

}
.text-\[var\(--cyan\)\] {

}
.text-\[var\(--danger\)\] {

}
.text-\[var\(--gold\)\] {

}
.text-\[var\(--green\)\] {
  color: var(--green);
}
.text-\[var\(--line\)\] {
  color: var(--line);
}
.text-\[var\(--muted\)\] {
  color: var(--muted);
}
.text-\[var\(--text\)\] {
  color: var(--text);
}
.text-black {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}
.outline-none {

}

:root {
  --bg: #050507;
  --surface: #0a0a0e;
  --surface-2: #101016;
  --panel: #0c0c11;
  --line: #3a3410;
  --line-soft: #23230f;
  --gold: #ffd700;
  --cyan: #00ccff;
  --green: #39ff88;
  --danger: #ff3b5c;
  --text: #ece9dc;
  --muted: #97937f;
  --safe-area-inset-top: 0px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #050507;
    --surface: #0a0a0e;
    --surface-2: #101016;
    --panel: #0c0c11;
    --line: #3a3410;
    --line-soft: #23230f;
    --gold: #ffd700;
    --cyan: #00ccff;
    --green: #39ff88;
    --danger: #ff3b5c;
    --text: #ece9dc;
    --muted: #97937f;
  }
}
html,
body {
  background: var(--bg);
  color: var(--text);
}
body {
  font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas,
    "Liberation Mono", monospace;
}
::-moz-selection {
  background: var(--gold);
  color: #050507;
}
::selection {
  background: var(--gold);
  color: #050507;
}
.nc-scroll::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
.nc-scroll::-webkit-scrollbar-track {
  background: #0a0a0e;
}
.nc-scroll::-webkit-scrollbar-thumb {
  background: #3a3410;
  border: 1px solid #050507;
}
.nc-scroll::-webkit-scrollbar-thumb:hover {
  background: var(--gold);
}
@keyframes nc-blink {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.15;
  }
}
.nc-blink {
  animation: nc-blink 1.1s steps(2, start) infinite;
}
@keyframes nc-scan {
  0% {
    transform: translateY(-100%);
  }
  100% {
    transform: translateY(400%);
  }
}
.hover\:border-\[var\(--gold\)\]:hover {
  border-color: var(--gold);
}
.hover\:bg-\[var\(--cyan\)\]:hover {
  background-color: var(--cyan);
}
.hover\:bg-\[var\(--danger\)\]:hover {
  background-color: var(--danger);
}
.hover\:bg-\[var\(--gold\)\]:hover {
  background-color: var(--gold);
}
.hover\:text-\[var\(--gold\)\]:hover {
  color: var(--gold);
}
.hover\:text-black:hover {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}
.focus\:border-\[var\(--gold\)\]:focus {
  border-color: var(--gold);
}
@media (min-width: 640px) {
  .sm\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .sm\:text-xl {
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}
@media (min-width: 768px) {
  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
@media (min-width: 1024px) {
  .lg\:inline {
    display: inline;
  }
}
@media (min-width: 1280px) {
  .xl\:grid-cols-\[290px_minmax\(0\2c 1fr\)_460px\] {
    grid-template-columns: 290px minmax(0,1fr) 460px;
  }
}
